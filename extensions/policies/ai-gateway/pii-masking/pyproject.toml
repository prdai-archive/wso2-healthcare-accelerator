[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pii-masking"
version = "1"
description = "WSO2 AI Gateway PII masking policy (OpenMed deidentification model) for the Python executor"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "torch @ https://download.pytorch.org/whl/cpu/torch-2.13.0%2Bcpu-cp310-cp310-manylinux_2_28_x86_64.whl ; python_version == '3.10' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch @ https://download.pytorch.org/whl/cpu/torch-2.13.0%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl ; python_version == '3.11' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "openmed[hf]>=1.9.1,<2.0.0",
  "fastapi>=0.110.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pii_masking_v1"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"policy-definition.yaml" = "pii_masking_v1/policy-definition.yaml"

[tool.hatch.build.targets.sdist]
only-include = [
  "src/pii_masking_v1",
  "pyproject.toml",
  "policy-definition.yaml",
  "README.md",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]
comparison = ["pytest>=8.0,<9.0", "matplotlib>=3.8,<4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: runs the real OpenMed model and may download model weights",
  "model_comparison: downloads candidate OpenMed models and measures policy.py locally",
]
