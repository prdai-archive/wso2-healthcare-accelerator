name: pii-masking
version: v1
displayName: PII Masking
description: |
  Redacts the buffered request body in-process with an OpenMed
  deidentification model — each detected entity becomes a delimited
  placeholder — and forwards the redacted payload upstream. On the response
  flow the same policy swaps the placeholders the LLM echoed back for the
  original values (rejecting hallucinated or mangled ones), so the client
  sees real data while the provider never does. No external service involved.

parameters:
  type: object
  additionalProperties: false
  properties:
    enabled:
      type: boolean
      default: true
      description: |
        Mask PII on the request and restore it on the response. When false the
        policy forwards traffic through unchanged. Falls back to the
        PII_MASKING_ENABLED environment variable, then true.
    jev:
      type: boolean
      default: false
      description: |
        Ask Jev whether the payload contains PII before masking. When false
        (default) every request is masked. When true, a confident "no PII"
        answer skips masking, saving the OpenMed run at the cost of one Jev
        call; an over-budget or failed Jev check masks anyway.

systemParameters:
  type: object
  additionalProperties: false
  properties: {}
