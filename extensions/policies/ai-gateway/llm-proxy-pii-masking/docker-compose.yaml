services:
  gateway-controller:
    image: ghcr.io/wso2/api-platform/pii-gateway-gateway-controller:1.2.0-alpha2

  gateway-runtime:
    image: ghcr.io/wso2/api-platform/pii-gateway-gateway-runtime:1.2.0-alpha2
    # The OpenMed model runs in the policy engine, so the distribution's 180m/0.175-cpu limits are far too small
    mem_limit: 6g
    mem_reservation: 1g
    cpus: 4
    environment:
      - HF_HOME=/data/hf-cache
    volumes:
      - hf-cache:/data/hf-cache

  platform-api:
    image: ghcr.io/wso2/api-platform/platform-api:0.12.0
    restart: unless-stopped
    command: ["-config", "/etc/platform-api/config-platform-api.toml"]
    env_file:
      - path: ../../workspace/dist/api-platform.env
        required: false
        format: raw
    volumes:
      - ../../workspace/dist/configs/config-platform-api.toml:/etc/platform-api/config-platform-api.toml:ro
      - platform-api-data:/app/data
      - ../../workspace/dist/resources/certificates:/etc/platform-api/tls:ro
    ports:
      - "9243:9243"
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:9243/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - gateway-network

  ai-workspace:
    image: ghcr.io/wso2/api-platform/ai-workspace:1.0.0-alpha2
    restart: unless-stopped
    depends_on:
      platform-api:
        condition: service_healthy
    env_file:
      - path: ../../workspace/dist/api-platform.env
        required: false
        format: raw
    volumes:
      - ../../workspace/dist/configs/config.toml:/etc/ai-workspace/config.toml:ro
      - ../../workspace/dist/resources/certificates:/etc/ai-workspace/tls:ro
    ports:
      - "5380:5380"
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:5380/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - gateway-network

volumes:
  hf-cache:
  platform-api-data:
